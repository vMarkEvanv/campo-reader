name: Windows desktop build
on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel (preview keeps the current stable update feed)
        type: choice
        options: [preview, stable]
        default: preview
  push:
    branches: [main]
    paths: [version.py]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\browsers
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install browser included in the application
        run: python -m playwright install --only-shell chromium
      - name: Download and verify Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature packaging/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'WebView2 bootstrapper signature is invalid' }
          $process = Start-Process packaging/MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent','/install' -PassThru -Wait
          if ($process.ExitCode -notin @(0,3010)) { Write-Host "WebView2 bootstrapper returned $($process.ExitCode); installed runtime will be checked by executable self-test" }
      - name: Run Windows regression tests
        run: python -m unittest discover -s tests -v
      - name: Build application icon and bundle
        run: |
          python packaging/make_icon.py
          python -m PyInstaller --noconfirm --clean CampoReader.spec
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
          Copy-Item packaging/USER_GUIDE.md dist/CampoReader/README.md
      - name: Verify the actual executable and embedded browser
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'smoke-windows.json'
          $proc = Start-Process -FilePath '.\dist\CampoReader\CampoReader.exe' -ArgumentList @('--self-test', "`"$report`"") -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Executable self-test timed out' }
          if (-not (Test-Path $report)) { throw 'Executable did not write self-test report' }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $proc.ExitCode -ne 0) { throw 'Windows executable self-test failed' }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $version = python -c "from version import VERSION; print(VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Compress-Archive -Path dist\CampoReader -DestinationPath release\CampoReader-Portable-Windows-x64.zip
          Copy-Item smoke-windows.json release\smoke-windows.json
          Get-ChildItem release -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release\SHA256SUMS.txt
      - name: Verify real upgrade and user-data preservation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.2.0 --repo $env:GITHUB_REPOSITORY --pattern CampoReader-Setup-Windows-x64.exe --dir old-release
          python packaging/test_installed_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed update integration test failed' }
          Get-ChildItem release -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release\SHA256SUMS.txt
      - name: Sign verified release assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          python packaging/sign_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release signing failed' }
          Get-ChildItem release -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release\SHA256SUMS.txt
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CampoReader-Windows-x64
          path: release/*
          retention-days: 30
          compression-level: 0
      - name: Upload failed executable diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CampoReader-build-diagnostic
          path: |
            smoke-windows.json
            build/CampoReader/warn-CampoReader.txt
          if-no-files-found: ignore
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'preview' }}
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Existing release preserved; increment version.py to publish a new release'; exit 0 }
          gh release create "v$version" release/* --draft --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Campo Reader $version - Windows" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          } else {
            gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
