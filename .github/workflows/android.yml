name: Android local app
on:
  workflow_dispatch:
  push:
    branches: ['android/**']
    paths: ['android/**', 'campo_backend/**', 'server.py', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campo-android.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/campo-android.p12" >> "$GITHUB_ENV"
      - name: Check shared backend and package Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          pip install -r requirements-web.txt
          python -m unittest discover -s tests -q
          node --check android/app/src/main/mobile/android-mobile.js
          gradle -p android assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on-device runtime, local UI, security and cache
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: gradle -p android connectedDebugAndroidTest --stacktrace
      - name: Prepare APK and checksums
        run: |
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk android-release/CampoReader-Android-0.1.1.apk
          cp android/README.md android-release/README.md
          cd android-release
          sha256sum CampoReader-Android-0.1.1.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose CampoReader-Android-0.1.1.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CampoReader-Android
          path: |
            android-release/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: warn
      - name: Publish separate Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v0.1.1 >/dev/null 2>&1 && exit 0
          gh release create android-v0.1.1 android-release/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'Campo Reader Android 0.1.1 — local preview' --notes-file android/release-notes.md
