plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'io.github.vmarkevanv.camporeader'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.vmarkevanv.camporeader'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'APP_VERSION', '"0.1.2"'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'campo-reader'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/campoAssets') } }
    packaging { jniLibs { useLegacyPackaging false } }
}
chaquopy {
    defaultConfig {
        version='3.11'
        pip {
            install 'requests==2.34.2'
            install 'icalendar==7.3.0'
            install 'recurring-ical-events==3.8.2'
            install 'tzdata==2026.5'
        }
    }
    sourceSets { main { srcDir layout.buildDirectory.dir('generated/campoPython') }; debug { srcDir 'src/debug/python' } }
}
tasks.register('prepareCampoPython', Copy) {
    from(rootProject.projectDir.parentFile) { include 'server.py'; include 'campo_backend/**/*.py' }
    into layout.buildDirectory.dir('generated/campoPython')
}
tasks.register('prepareCampoAssets', Copy) {
    from(rootProject.file('../public')) { include 'campo-*'; include 'work-theme.css' }
    from('src/main/mobile')
    into layout.buildDirectory.dir('generated/campoAssets/public')
}
tasks.named('preBuild') { dependsOn 'prepareCampoPython', 'prepareCampoAssets' }
tasks.configureEach { task ->
    if(task.name.toLowerCase().contains('lint')) task.dependsOn 'prepareCampoPython', 'prepareCampoAssets'
    if(task.name.startsWith('generate') && task.name.endsWith('PythonRequirementsAssets')) task.dependsOn 'prepareCampoPython'
    if(task.name.toLowerCase().contains('python') && task.name != 'prepareCampoPython') task.dependsOn 'prepareCampoPython'
    if(task.name.startsWith('merge') && task.name.endsWith('Assets')) task.dependsOn 'prepareCampoAssets'
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
